name: Continous Integration

on:
    pull_request:
        branches: [main, release, dev]

jobs:
    quality:
        name: Code Quality & Tests
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write

        steps:
          - name: Checkout Repository
            uses:  actions/checkout@v4
        
          - name: Set Up Node Js 20.x
            uses: actions/setup-node@v4
            with:
              node-version: '20.x'
              cache: 'npm'
        
          - name: Install Dependencies
            run: npm ci
         
          - name: Run Linter
            run: npm run lint
            continue-on-error: true  # Prevents pipeline fail if lint script isn't configured yet

          - name: Run test coverage
            run: npm run test:coverage
            continue-on-error: true
        
          - name: Build Coverage Comment
            if: github.event_name == 'pull_request'
            run: |
              if [ ! -f coverage/coverage-summary.json ]; then
                echo "## 📊 Coverage Summary
                No coverage summary generated." > coverage-comment.md
                exit 0
              fi
              node -e '
                const data = require("./coverage/coverage-summary.json");
                const t = data.total;
                const sha = (process.env.GITHUB_SHA || "").slice(0,7);
                const lines = [
                  "## 📊 Code Coverage Summary",
                  "",
                  "| Metric | Covered | Total | % |",
                  "|--------|---------|-------|---|",
                  "| **Statements** | " + t.statements.covered + " | " + t.statements.total + " | " + t.statements.pct + "% |",
                  "| **Branches** | " + t.branches.covered + " | " + t.branches.total + " | " + t.branches.pct + "% |",
                  "| **Functions** | " + t.functions.covered + " | " + t.functions.total + " | " + t.functions.pct + "% |",
                  "| **Lines** | " + t.lines.covered + " | " + t.lines.total + " | " + t.lines.pct + "% |",
                  "",
                  "> Generated from commit `" + sha + "`"
                ].join("\n");
                require("fs").writeFileSync("coverage-comment.md", lines);
              '
          
          - name: Post Coverage Report to PR
            if: github.event_name == 'pull_request'
            uses:  marocchino/sticky-pull-request-comment@v2
            with:
              header: test-coverage
              path: coverage-comment.md
    
    terraform_plan:
        name: Terraform Plan (DEV)
        runs-on: ubuntu-latest    
        defaults:
          run:
            # Dynamically routes to dev, pre-prod, or prod based on target PR branch
            working-directory: ${{ fromJson('{dev:"./provisioning/nonprod/dev", release:"./provisioning/nonprod/pre-prod", main:"./provisioning/prod/prod"}')[github.base_ref] }}

        steps:
          - name: Check out repository
            uses: actions/checkout@v4
       
          - name: Set Up AWS Credentials for Prod 
            if: github.base_ref == 'main'
            run: |
              echo "AWS_ACCESS_KEY_ID=${{ secrets.PROD_AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV

          - name: Setup AWS Credentials for Non-Prod (Dev & Release)
            if: github.base_ref != 'main'
            run: |
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV

          - name: Setup Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: ">=1.1.3"
              
          - name: Verify Terraform version 
            run: terraform --version
        
          - name: Terraform Init
            env:
             AWS_DEFAULT_REGION: "eu-west-2"
            run: terraform init -input=false

          - name: Terraform Plan
            env:
              AWS_DEFAULT_REGION: "eu-west-2"
              TF_VAR_app_version: ${{ github.sha }}
            run: terraform plan -input=false

         
